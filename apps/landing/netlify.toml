[build]
  command = "npm run build -w apps/landing"
  # Exit 1 builds, exit 0 skips. The lockfile and root package.json are listed so a dependency-only bump still rebuilds.
  # Equal refs mean "Trigger deploy" with no new commit, which always builds: the app bakes Netlify's URL at build time.
  ignore = '[ "$CACHED_COMMIT_REF" != "$COMMIT_REF" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/landing package.json package-lock.json'

# Netlify's default hostname keeps serving the site after a custom domain is added; send it to the primary domain so there is one public address
[[redirects]]
  from = "https://rutaopta.netlify.app/*"
  to = "https://www.rutaopta.org/:splat"
  status = 301
  force = true

# The home's first social card shipped at a content-hashed path (PR #10); links shared since then keep that URL in their cached
# preview, so it points at the stable per-locale card once the hashed file is gone. Not forced: it applies only when the file is missing
[[redirects]]
  from = "/_next/static/media/home-og.29lym9iu9n3f1.jpg"
  to = "/og/home-es-v2.jpg"
  status = 301

# The analytics vendor behind first-party paths: proxyPaths in src/modules/analytics/plausible.ts, held in step by tests/analytics-wiring.test.mjs.
# A rewrite passes the browser's headers on, so the headers map blanks the cookie and cuts the Referer to the home. NOT YET VERIFIED: that the map
# overrides a header the browser sent, rather than only adding one
[[redirects]]
  from = "/o/s.js"
  to = "https://plausible.io/js/pa-gVAEa_XsPsebKDIjckNPK.js"
  status = 200
  force = true
  headers = { Cookie = "", Referer = "https://www.rutaopta.org/" }

[[redirects]]
  from = "/o/e"
  to = "https://plausible.io/api/event"
  status = 200
  force = true
  headers = { Cookie = "", Referer = "https://www.rutaopta.org/" }
